    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();

        const i18n = {
          de: {
            nav_photo:         'FOTOGRAFIE',
            nav_video:         'VIDEO',
            nav_contact:       'KONTAKT',
            label_get_in_touch:'KONTAKT',
            heading:           'Lass uns\nzusammenarbeiten.',
            label_location:    'STANDORT',
            label_germany:     'Deutschland',
            label_spain:       'Spanien',
            label_email:       'E-MAIL',
            btn_send:          'ANFRAGE SENDEN',
            msg_sent:          'Nachricht gesendet — ich melde mich bald.',
            msg_error:         'Etwas ist schiefgelaufen. Bitte direkt per E-Mail schreiben.',
            btn_sending:       'WIRD GESENDET...',
            btn_sent:          'GESENDET ✓',
            btn_retry:         'ERNEUT VERSUCHEN',
          },
          en: {
            nav_photo:         'PHOTOGRAPHY',
            nav_video:         'VIDEO',
            nav_contact:       'CONTACT',
            label_get_in_touch:'GET IN TOUCH',
            heading:           "Let's work\ntogether.",
            label_location:    'LOCATION',
            label_germany:     'Germany',
            label_spain:       'Spain',
            label_email:       'EMAIL',
            btn_send:          'SEND INQUIRY',
            msg_sent:          "Message sent — I'll be in touch soon.",
            msg_error:         'Something went wrong. Please email directly.',
            btn_sending:       'SENDING...',
            btn_sent:          'SENT ✓',
            btn_retry:         'TRY AGAIN',
          }
        };

        let currentLang = localStorage.getItem('pv_lang') || (navigator.language.startsWith('en') ? 'en' : 'de');

        function applyLang(lang) {
          currentLang = lang;
          localStorage.setItem('pv_lang', lang);
          document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (i18n[lang][key] !== undefined) {
              if (key === 'heading') {
                el.innerHTML = i18n[lang][key].replace('\n', '<br/>');
              } else {
                el.textContent = i18n[lang][key];
              }
            }
          });
          document.querySelectorAll('[data-placeholder-de]').forEach(el => {
            el.placeholder = lang === 'de' ? el.dataset.placeholderDe : el.dataset.placeholderEn;
          });
          document.querySelectorAll('#langToggle, #langToggleMobile').forEach(btn => {
            btn.textContent = lang === 'de' ? 'EN' : 'DE';
          });
        }

        document.querySelectorAll('#langToggle, #langToggleMobile').forEach(btn => {
          btn.addEventListener('click', () => applyLang(currentLang === 'de' ? 'en' : 'de'));
        });

        applyLang(currentLang);

        // ── Mobile menu ──
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeMenuBtn  = document.getElementById('close-menu-btn');
        const mobileOverlay = document.getElementById('mobile-overlay');
        function openMenu()  { mobileOverlay.classList.remove('hidden'); mobileOverlay.classList.add('flex'); mobileMenuBtn.setAttribute('aria-expanded','true');  document.body.classList.add('mobile-menu-open'); }
        function closeMenu() { mobileOverlay.classList.add('hidden');    mobileOverlay.classList.remove('flex'); mobileMenuBtn.setAttribute('aria-expanded','false'); document.body.classList.remove('mobile-menu-open'); }
        mobileMenuBtn.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click',  closeMenu);
        mobileOverlay.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

        // ── EmailJS form ──
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const t = i18n[currentLang];
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            submitBtn.textContent = t.btn_sending;
            submitBtn.disabled = true;
            statusMsg.className = '';
            statusMsg.style.display = 'none';

            emailjs.sendForm('service_z7mhni9', 'template_l6336q9', this)
                .then(() => {
                    submitBtn.textContent = t.btn_sent;
                    submitBtn.classList.add('success');
                    statusMsg.textContent = t.msg_sent;
                    statusMsg.className = 'show success';
                    setTimeout(() => {
                        submitBtn.textContent = t.btn_send;
                        submitBtn.classList.remove('success');
                        submitBtn.disabled = false;
                        statusMsg.className = '';
                        statusMsg.style.display = 'none';
                        document.getElementById('contact-form').reset();
                    }, 4000);
                })
                .catch((error) => {
                    console.error('EmailJS error:', error);
                    submitBtn.textContent = t.btn_retry;
                    submitBtn.classList.add('error-state');
                    statusMsg.textContent = t.msg_error;
                    statusMsg.className = 'show error-msg';
                    setTimeout(() => {
                        submitBtn.textContent = t.btn_send;
                        submitBtn.classList.remove('error-state');
                        submitBtn.disabled = false;
                    }, 4000);
                });
        });
    </script>
