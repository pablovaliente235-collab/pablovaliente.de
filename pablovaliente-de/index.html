<style>
  :root {
    --bg:     #ffffff;
    --black:  #0C0C0B;
    --white:  #FFFFFF;
    --ease:   cubic-bezier(0.16, 1, 0.3, 1);
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid #A8895A; outline-offset: 3px; }
  html, body { width: 100%; height: 100%; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); -webkit-font-smoothing: antialiased; cursor: none; overflow: hidden; }

  /* ── Custom cursor ── */
  #cur-arrow {
    position: fixed; z-index: 9999; pointer-events: none;
    transform: translate(-2px,-2px); transition: opacity .2s;
    will-change: left, top; opacity: 0;
  }
  #cur-arrow.is-ready { opacity: 1; }
  #cur-open {
    position: fixed; z-index: 9999; width: 68px; height: 68px; border-radius: 50%;
    background: var(--black); pointer-events: none;
    transform: translate(-50%,-50%) scale(0); transition: transform .3s var(--ease);
    display: flex; align-items: center; justify-content: center;
  }
  #cur-open span { font-size: 8px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; color: var(--white); }
  body.on-card #cur-arrow { opacity: 0; }
  body.on-card #cur-open  { transform: translate(-50%,-50%) scale(1); }
  body.on-interactive #cur-arrow { opacity: 0; }
  body.on-interactive #cur-open  { transform: translate(-50%,-50%) scale(.2); }
  body.on-interactive #cur-open span { display: none; }

  /* ── Grain ── */
  .grain {
    position: fixed; inset: 0; z-index: 9990; pointer-events: none; opacity: .025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 120px; animation: gr .35s steps(1) infinite;
  }
  @keyframes gr {
    0%  { transform: translate(0,0);    } 25% { transform: translate(-3%,2%);  }
    50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,3%);  }
  }

  /* ── Stage ── */
  .stage {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .stage > *, .slider-col { pointer-events: auto; }
  .stage::before, .stage::after {
    content: ''; position: fixed; top: 0; bottom: 0;
    width: 40px; background: #ffffff; z-index: 550; pointer-events: none;
  }
  .stage::before { left: 0; }
  .stage::after  { right: 0; }

  /* ── DESKTOP ACCORDION SLIDER ── */
  .slider-col {
    position: relative;
    align-self: flex-start;
    margin-top: 60px;
    width: 100vw;
    height: calc(100vh - 104px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    opacity: 0;
    animation: fadeInUp .9s var(--ease) .2s forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .slider-track {
    display: flex;
    flex-shrink: 0;
    width: min(calc(100vw + 20px), 1640px);
    height: min(calc(37.8vw - 5px), 609px);
    gap: 12px;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card-wrap {
    flex: 1.02;
    min-width: 0;
    transition: flex 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  .card-wrap.is-active { flex: 4; }

  .card {
    position: relative; width: 100%; height: 100%;
    border-radius: var(--radius); overflow: hidden; background: #1a1510;
    cursor: none;
  }
  .card__overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%);
    opacity: 0; transition: opacity .5s;
  }
  .card.is-active .card__overlay { opacity: 1; }

  .card__carousel { position: absolute; inset: 0; }
  .card__carousel-frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scale(1.02);
    opacity: 0; transition: opacity 1.1s ease;
    pointer-events: none; will-change: opacity;
  }
  .card__carousel-frame.is-active { opacity: 1; }

  /* ── MOBILE / TABLET ≤ 1024px ── */
  @media (max-width: 1024px) {
    #cur-arrow, #cur-open { display: none !important; }
    body { cursor: auto; overflow-x: hidden; }
    .card { cursor: pointer; }
    .stage::before, .stage::after { display: none; }
    .slider-col {
      align-self: center;
      margin-top: calc(var(--header-h, 56px) / 2);
      height: auto;
    }
    .slider-track {
      flex-direction: column;
      width: min(88vw, 480px);
      height: min(calc(87vw + 36px), 507px);
      flex-shrink: 0;
    }
    .card-wrap { flex: 1; min-width: unset; width: 100%; min-height: 0; }
  }

  /* ── Slide label ── */
  #slide-label a { font-size: 9px; }
  @media (max-width: 768px) {
    #slide-label { bottom: 24px !important; }
    #slide-label a { font-size: 8px; }
  }

  /* ── Mobile menu overlay ── */
  @media (max-width: 1023px) {
    .mobile-menu-open { overflow: hidden; }
    #mobile-overlay { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; overflow: hidden !important; }
  }
  @media (hover: none) and (pointer: coarse) {
    a:hover, button:hover { color: inherit !important; }
  }
</style>

<script>
'use strict';

const i18n = {
  de: {
    nav_photo:    'FOTOGRAFIE',
    nav_video:    'VIDEO',
    nav_contact:  'KONTAKT',
    cur_open:     'ÖFFNEN',
    card_label_0: 'FOTOGRAFIE',
    card_label_1: 'FOTOGRAFIE',
    card_label_2: 'VIDEO',
    card_label_3: 'FOTOGRAFIE',
  },
  en: {
    nav_photo:    'PHOTOGRAPHY',
    nav_video:    'VIDEO',
    nav_contact:  'CONTACT',
    cur_open:     'OPEN',
    card_label_0: 'PHOTOGRAPHY',
    card_label_1: 'PHOTOGRAPHY',
    card_label_2: 'VIDEO',
    card_label_3: 'PHOTOGRAPHY',
  }
};

let currentLang = localStorage.getItem('pv_lang') || (navigator.language.startsWith('en') ? 'en' : 'de');

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('pv_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key] !== undefined) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll('#langToggle, #langToggleMobile, #langToggleOverlay').forEach(btn => {
    btn.textContent = lang === 'de' ? 'EN' : 'DE';
  });
  const labelLink = document.querySelector('#slide-label a');
  if (labelLink) {
    labelLink.textContent = i18n[lang]['card_label_' + vCurrent] + ' →';
  }
}

document.querySelectorAll('#langToggle, #langToggleMobile, #langToggleOverlay').forEach(btn => {
  btn.addEventListener('click', () => applyLang(currentLang === 'de' ? 'en' : 'de'));
});

function updateHeaderOffset() {
  const header = document.getElementById('unified-header');
  if (header) {
    document.documentElement.style.setProperty('--header-h', header.getBoundingClientRect().height + 'px');
  }
}
updateHeaderOffset();
window.addEventListener('resize', updateHeaderOffset);

const curArrow = document.getElementById('cur-arrow');
const curOpen  = document.getElementById('cur-open');
document.addEventListener('mousemove', e => {
  curArrow.style.left = e.clientX + 'px'; curArrow.style.top = e.clientY + 'px';
  curOpen.style.left  = e.clientX + 'px'; curOpen.style.top  = e.clientY + 'px';
  curArrow.classList.add('is-ready');
});
document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('on-interactive'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('on-interactive'));
});

const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const closeMenuBtn  = document.getElementById('close-menu-btn');
const mobileOverlay = document.getElementById('mobile-overlay');
function openMenu()  { mobileOverlay.classList.remove('hidden'); mobileOverlay.classList.add('flex'); mobileMenuBtn.setAttribute('aria-expanded','true');  document.body.classList.add('mobile-menu-open'); }
function closeMenu() { mobileOverlay.classList.add('hidden');    mobileOverlay.classList.remove('flex'); mobileMenuBtn.setAttribute('aria-expanded','false'); document.body.classList.remove('mobile-menu-open'); }
mobileMenuBtn.addEventListener('click', openMenu);
closeMenuBtn.addEventListener('click',  closeMenu);
mobileOverlay.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

const track = document.getElementById('track');
const col   = document.getElementById('sliderCol');
const INTERVAL = 5000;
const realCards = Array.from(track.querySelectorAll('.card-wrap'));
const N = realCards.length;
let vCurrent = 0;
let timer = null;

function realIdx(v) { return ((v % N) + N) % N; }
function isMobileSlider() { return window.innerWidth <= 1024; }

function updateTrackShift(ri) {
  if (isMobileSlider()) return;
  const vw = window.innerWidth;
  const trackWidth = Math.min(vw + 20, 1640);
  const trackLeft = (vw - trackWidth) / 2;
  const shift = Math.max(0, 40 + 12 - trackLeft);
  let tx = 0;
  if (ri === 0)                         tx =  shift;
  else if (ri === realCards.length - 1) tx = -shift;
  track.style.transform = tx ? `translateX(${tx}px)` : '';
}

function updateActive(ri) {
  updateTrackShift(ri);
  realCards.forEach((c, idx) => {
    const active = idx === ri;
    c.classList.toggle('is-active', active);
    c.querySelector('.card')?.classList.toggle('is-active', active);
  });
  const labelLink = document.querySelector('#slide-label a');
  if (labelLink) {
    labelLink.href = realCards[ri].dataset.href;
    labelLink.textContent = i18n[currentLang]['card_label_' + ri] + ' →';
  }
}

function navigate() {
  const href = realCards[vCurrent].dataset.href;
  if (href) window.location.href = href;
}

function goTo(v) {
  const ri = realIdx(v);
  vCurrent = ri;
  updateActive(ri);
  resetTimer();
}

function resetTimer() {
  clearInterval(timer);
  timer = setInterval(() => goTo(vCurrent + 1), INTERVAL);
}

realCards.forEach((c, idx) => {
  c.addEventListener('click', e => {
    if (isMobileSlider()) return;
    if (e.target.closest('header, button')) return;
    if (idx === vCurrent) navigate();
    else goTo(idx);
  });
  c.addEventListener('mouseenter', () => { if (!isMobileSlider()) document.body.classList.add('on-card'); });
  c.addEventListener('mouseleave', () => document.body.classList.remove('on-card'));
});

document.addEventListener('click', e => {
  if (!isMobileSlider()) return;
  if (e.target.closest('header, button')) return;
  if (realCards[vCurrent]?.contains(e.target)) navigate();
  else goTo(e.clientY < window.innerHeight / 2 ? vCurrent - 1 : vCurrent + 1);
});

let wheelAccum = 0, wheelReady = true;
col.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  wheelAccum += delta;
  if (Math.abs(delta) < 2) { wheelReady = true; wheelAccum = 0; return; }
  if (wheelReady && Math.abs(wheelAccum) > 30) {
    wheelReady = false; wheelAccum = 0;
    goTo(delta > 0 ? vCurrent + 1 : vCurrent - 1);
  }
}, { passive: false });

document.addEventListener('keydown', e => {
  if (!isMobileSlider()) {
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(vCurrent + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(vCurrent - 1); }
  } else {
    if (e.key === 'ArrowDown') { e.preventDefault(); goTo(vCurrent + 1); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); goTo(vCurrent - 1); }
  }
});

let tX = 0, tY = 0;
col.addEventListener('touchstart', e => { tX = e.touches[0].clientX; tY = e.touches[0].clientY; }, { passive: true });
col.addEventListener('touchend', e => {
  const dx = tX - e.changedTouches[0].clientX;
  const dy = tY - e.changedTouches[0].clientY;
  if (!isMobileSlider()) {
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) goTo(dx > 0 ? vCurrent + 1 : vCurrent - 1);
  } else {
    if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) goTo(dy > 0 ? vCurrent + 1 : vCurrent - 1);
  }
}, { passive: true });

window.addEventListener('load', () => {
  applyLang(currentLang);
  goTo(0); resetTimer();
});
window.addEventListener('resize', () => goTo(vCurrent));

// Carousel animation — runs only while card is active
document.querySelectorAll('.card__carousel').forEach(carousel => {
  const cardWrap = carousel.closest('.card-wrap');
  const frames = Array.from(carousel.querySelectorAll('.card__carousel-frame'));
  if (frames.length < 2) return;
  let cur = 0, carouselTimer = null;
  frames.forEach((f, i) => f.classList.toggle('is-active', i === 0));

  function startCarousel() {
    if (carouselTimer) return;
    carouselTimer = setInterval(() => {
      frames[cur].classList.remove('is-active');
      cur = (cur + 1) % frames.length;
      frames[cur].classList.add('is-active');
    }, 2000);
  }
  function stopCarousel() {
    clearInterval(carouselTimer); carouselTimer = null;
    frames[cur].classList.remove('is-active'); cur = 0; frames[0].classList.add('is-active');
  }
  new MutationObserver(() => {
    cardWrap.classList.contains('is-active') ? startCarousel() : stopCarousel();
  }).observe(cardWrap, { attributes: true, attributeFilter: ['class'] });
});
</script>
</body>
</html>
